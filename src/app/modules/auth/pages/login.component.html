<div class="login-container">
  
  <!-- LADO IZQUIERDO: FORMULARIO (35% - 40%) -->
  <aside class="login-sidebar fade-in">
    <div class="login-content">
      <div class="brand-section mb-5">
        <img src="logo2.png" alt="Logo" class="login-logo">
      </div>

      <div class="header-section mb-4">
        <h2 class="fw-bold title-gradient">Celucentro</h2>
        <p class="text-muted">Sistema Centralizado de Gestión Técnica</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Usuario -->
        <div class="form-group mb-3">
          <label class="form-label-custom">Usuario / Correo</label>
          <div class="input-wrapper">
            <i class="bi bi-person-circle icon-input"></i>
            <input type="email" formControlName="correo" class="form-input-custom" placeholder="Ingresa tu correo">
          </div>
        </div>
        
        <!-- Contraseña -->
        <div class="form-group mb-4">
          <label class="form-label-custom">Contraseña</label>
          <div class="input-wrapper">
            <i class="bi bi-shield-lock icon-input"></i>
            <input type="password" formControlName="clave" class="form-input-custom" placeholder="••••••••">
          </div>
        </div>

        <!-- Alerta de Error -->
        <div *ngIf="errorMessage()" class="error-box mb-4">
          <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMessage() }}
        </div>

        <!-- BOTÓN ENTRAR -->
        <button type="submit" class="btn-login" [disabled]="loginForm.invalid || isLoading()">
          <div *ngIf="!isLoading()" class="d-flex align-items-center justify-content-center">
            <span>INICIAR SESIÓN</span>
            <i class="bi bi-arrow-right ms-2"></i>
          </div>
          <div *ngIf="isLoading()" class="spinner-border spinner-border-sm" role="status"></div>
        </button>
      </form>

      <footer class="login-footer mt-auto pt-4">
        <p class="small text-muted text-center">© 2024 Celucentro v2.0</p>
      </footer>
    </div>
  </aside>

  <!-- LADO DERECHO: ANIMACIÓN TECNOLÓGICA (CANVAS) -->
  <main class="visual-section">
    <!-- Canvas animado mediante lógica de Angular -->
    <canvas #canvas class="particles-canvas"></canvas>
    
    <div class="visual-overlay"></div>

    <div class="floating-content">
      <div class="tech-badge">SISTEMA INTELIGENTE</div>
      <h1 class="display-3 fw-bold mb-3">Red de Soporte</h1>
      <p class="lead">Líderes en gestión técnica y administrativa para dispositivos móviles.</p>
      
      <div class="tech-stats">
        <div class="stat-item">
          <span class="stat-value">24/7</span>
          <span class="stat-label">DISPONIBLE</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-value">SSL</span>
          <span class="stat-label">PROTEGIDO</span>
        </div>
      </div>
    </div>
  </main>

</div>

<div class="login-container">
  
  <!-- LADO IZQUIERDO: FORMULARIO -->
  <aside class="login-sidebar fade-in">
    <div class="login-content">
      <div class="brand-section mb-5">
        <img src="logo2.png" alt="Logo" class="login-logo">
      </div>

      <div class="header-section mb-4">
        <h2 class="fw-bold">Bienvenido</h2>
        <p class="text-muted">Ingresa tus credenciales para continuar</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Usuario -->
        <div class="form-group mb-3">
          <label class="form-label-custom">Correo Electrónico</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope icon-input"></i>
            <input type="email" formControlName="correo" class="form-input-custom" placeholder="ejemplo@correo.com">
          </div>
        </div>
        
        <!-- Contraseña -->
        <div class="form-group mb-4">
          <label class="form-label-custom">Contraseña</label>
          <div class="input-wrapper">
            <i class="bi bi-lock icon-input"></i>
            <input type="password" formControlName="clave" class="form-input-custom" placeholder="••••••••">
          </div>
        </div>

        <!-- Alerta de Error -->
        <div *ngIf="errorMessage()" class="error-message mb-4">
          <i class="bi bi-exclamation-circle-fill me-2"></i> {{ errorMessage() }}
        </div>

        <!-- BOTÓN ENTRAR -->
        <button type="submit" class="btn-login" [disabled]="loginForm.invalid || isLoading()">
          <span *ngIf="!isLoading()">Acceder al Sistema</span>
          <div *ngIf="isLoading()" class="spinner-border spinner-border-sm" role="status"></div>
        </button>
      </form>

      <footer class="login-footer mt-auto">
        <p class="small text-muted text-center">© 2024 Celucentro - Gestión Tecnológica</p>
      </footer>
    </div>
  </aside>

  <!-- LADO DERECHO: ANIMACIÓN TECNOLÓGICA -->
  <main class="visual-section">
    <div class="tech-grid"></div>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <div class="visual-overlay">
      <div class="floating-icons">
        <i class="bi bi-cpu"></i>
        <i class="bi bi-phone"></i>
        <i class="bi bi-gpu-card"></i>
        <i class="bi bi-wifi"></i>
      </div>
      <div class="hero-text">
        <h1 class="display-4 fw-bold">Innovación en cada reparación</h1>
        <p class="lead">Plataforma integral de gestión de servicios técnicos.</p>
      </div>
    </div>
  </main>

</div>
